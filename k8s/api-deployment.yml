apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: webhook-queue
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: webhook-queue-lab:dev
          imagePullPolicy: IfNotPresent
          command: ["npm", "run", "start:api"]
          envFrom:
            - configMapRef:
                name: webhook-queue-config
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10