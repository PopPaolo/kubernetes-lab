apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: webhook-queue
  labels:
    app: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: webhook-queue-lab:dev
          imagePullPolicy: IfNotPresent
          command: ["npm", "run", "start:worker"]
          envFrom:
            - configMapRef:
                name: webhook-queue-config
          ports:
            - containerPort: 3001
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
